name: Assurely
kind: company
description: >-
  Assurely is a United States insurtech and managing general agent (MGA) founded by
  David Carpentier and Ty Sagalow that builds and distributes commercial
  property-and-casualty insurance for companies with unconventional funding models,
  most notably TigerMark, a directors-and-officers (D&O) product written for
  Regulation CF / Regulation A crowdfunding issuers and early-stage startups that
  incumbent carriers decline. Assurely positioned itself as an "Insurance-as-a-Service"
  (IaaS) provider embedding industry-specific products plus a multi-carrier marketplace
  into vertical SaaS operating systems in fintech and capital raising, proptech and
  construction, property management, blockchain and digital assets, and SMB
  marketplaces (named partners include Wefunder, Silicon Prairie, Fairmint, Dalmore
  Group, Buildertrend and CoConstruct), and stated licensing in all 50 states and
  Bermuda. Its API posture is the honest floor of this sector — no public, self-serve
  developer portal, no API reference, and no downloadable OpenAPI was ever published.
  "Embedded" here meant a commercial partnership with white-labeled quote-and-bind web
  flows on client.assurely.com and tigermark.assurely.com plus human advisory and
  administration, not a documented partner API. Assurely was acquired by Equal Parts on
  2025-06-26, and as of the 2026-07-25 review its entire public surface is offline —
  www.assurely.com returns HTTP 404 as an expired Squarespace site, and
  api./client./tigermark.assurely.com are dangling CNAMEs to a deleted AWS load
  balancer. Home market is the United States.
