aid: assurely
name: Assurely
review:
  question: Does Assurely expose a public, self-serve developer portal or a downloadable
    API definition for its embedded insurance products?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  sector: Insurance
  tier: embedded-insurance
  gated: true
  portalConfirmed: false
  openapiHarvested: false
  specsCount: 0
findings:
  summary: |
    Assurely publishes no public API surface of any kind. There is no developer
    portal, no API reference, no downloadable OpenAPI/Swagger, no Postman
    workspace, no GraphQL endpoint, and no event/webhook catalog. Beyond that,
    Assurely's public infrastructure is now entirely offline. The marketing site
    at www.assurely.com returns HTTP 404 with a Squarespace "Website Expired"
    interstitial, and every application subdomain (api., client., tigermark.)
    is a dangling CNAME pointing at an AWS load balancer hostname
    (hostingelb-production-1845880914.us-east-2.elb.amazonaws.com) that no longer
    resolves. Assurely was acquired by Equal Parts on 2025-06-26 and the public
    estate appears to have been decommissioned rather than migrated.

    The word "embedded" in Assurely's own marketing did not mean an API. Its
    Insurance-as-a-Service (IaaS) pitch described a commercial revenue-share
    partnership in which Assurely stood up white-labeled, industry-specific
    quote-and-bind web flows for a vertical SaaS partner's users (per-partner
    paths such as tigermark.assurely.com/partner/wefunder and
    client.assurely.com/partner/coconstruct), backed by "full service
    administrative and advisory capabilities" and a "blended technology + human
    touch user experience." That is a hosted-page distribution model, not a
    programmable one. A full sweep of 188 unique archived assurely.com URLs in
    the Internet Archive found zero developer, docs, api-reference, swagger, or
    openapi paths, and the marketing pages that describe the embedded/IaaS
    product contain zero occurrences of the tokens "API", "developer",
    "webhook", "SDK", or "OpenAPI".

    This is the expected and correct outcome for a small US MGA. The US has no
    federal insurance regulator and no open-insurance mandate — insurance is
    regulated state by state under NAIC model laws — so nothing forces an MGA to
    publish anything, and Assurely never did.
  acordPosture: no ACORD reference found
  acordEvidence: |
    Searched the live site (404 everywhere) and the archived assurely.com corpus
    for ACORD, AL3, ACORD XML, ACORD certified, NGDS, IVANS, agency download,
    Applied Epic, and Vertafore AMS360. Zero matches. Assurely distributed
    through partner platforms and its own hosted web flows, not through the
    IVANS/agency-management-system download plumbing that carries ACORD AL3 and
    ACORD XML between US carriers and independent agencies.
  insuranceVerbs:
    quote: hosted web flow only (tigermark.assurely.com, now offline); no documented API
    bind: hosted web flow only; no documented API
    issue: not exposed; no documented API
    fnol: not exposed; no claims or FNOL surface documented or archived
    audience: partner-only / consumer via partner-branded hosted pages
    note: |
      None of the four insurance verbs is available programmatically. Unlike the
      genuinely API-first embedded players (Cover Genius XCover, Boost, Sure,
      Extend), Assurely never published quote/bind/issue or FNOL endpoints.
  authModel: |
    No public authentication scheme is documented. No API keys, no OAuth2, no
    mTLS, no SAML partner-portal documentation was found. Probes of
    https://www.assurely.com/.well-known/openid-configuration and
    https://www.assurely.com/.well-known/oauth-authorization-server both returned
    HTTP 404. The only historical login surface was client.assurely.com, a broker
    and partner client portal, which is now unreachable.
  webhooks: none documented; no event catalog and no AsyncAPI found
  postman: no public Postman collection or workspace found
  graphql: no /graphql surface found; all application hosts are unreachable
  grpc: no published .proto found
  corporateStatus: |
    Acquired by Equal Parts (announced 2025-06-26, BusinessWire), the acquirer's
    second deal after Lumen Insurance. Equal Parts stated Assurely's operations
    would move onto Equal Parts' technology platform. No successor developer
    surface was identified: equalparts.com resolves to a domain-sale listing
    (HTTP 403 redirecting to atom.com) and equalpartsinsurance.com fails TLS
    negotiation.
  transports:
  - protocol: REST
    documented: false
    note: No REST API is documented or archived.
  - protocol: GraphQL
    documented: false
  - protocol: gRPC
    documented: false
  - protocol: WebSocket
    documented: false
  - protocol: AsyncAPI/Events
    documented: false
  - protocol: ACORD AL3 / ACORD XML / EDI
    documented: false
    note: No ACORD or IVANS agency-download reference found anywhere.
  - protocol: HTTPS hosted web application
    documented: true
    note: |
      The real integration surface was partner-branded hosted quote/bind pages on
      tigermark.assurely.com and client.assurely.com. Human/commercial onboarding,
      not machine onboarding. Both hosts are now dead (dangling CNAME).
