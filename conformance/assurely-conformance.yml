regulatory_context: |
  The United States has no federal insurance regulator and no open-insurance
  mandate. Insurance is regulated state by state under NAIC model laws, so no
  rule obliges a managing general agent to publish an API, a specification, or a
  conformance claim. Assurely's total absence of standards conformance is the
  expected posture for a small US MGA, not a deviation from a requirement.
