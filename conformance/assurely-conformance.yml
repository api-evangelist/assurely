summary: |
  Assurely conforms to none of the cross-cutting API standards and none of the
  US property-and-casualty insurance interchange standards. It never published a
  machine-readable contract, and its distribution model was partner-branded
  hosted quote-and-bind web pages rather than either a REST API or the
  ACORD/IVANS agency-download plumbing that carries data between US carriers and
  independent agencies. No compliance program, certification, or audit report
  (SOC 2, ISO 27001, PCI DSS, HIPAA) was ever published either, so no Compliance
  pointer is wired.
